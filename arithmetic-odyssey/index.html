<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <title>Arithmetic Odyssey</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- js/app.js replaces this with the game's screens. -->
  <div id="app">
    <main class="screen loading-screen">
      <h1>Arithmetic Odyssey</h1>
      <p id="load-status" class="load-status" role="status">Loading…</p>
    </main>
  </div>

  <noscript><p class="load-error">Arithmetic Odyssey needs JavaScript turned on.</p></noscript>
  <script nomodule>
    document.getElementById('load-status').textContent = 'This browser is too old for Arithmetic Odyssey. Please update the iPad.';
  </script>
  <script>
    // If the game's scripts haven't run after 5 seconds, say so instead of
    // showing "Loading…" forever. js/app.js sets data-ready when it runs.
    setTimeout(function () {
      if (document.documentElement.dataset.ready !== '1') {
        var status = document.getElementById('load-status');
        if (status) {
          status.textContent = "The game's files didn't load. Check the internet connection and reload.";
          status.className = 'load-status error';
        }
      }
    }, 5000);
  </script>
</body>
</html>
