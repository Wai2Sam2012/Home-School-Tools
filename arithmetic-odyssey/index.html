<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <title>Arithmetic Odyssey</title>
  <!-- The installable app: Add to Home Screen opens it full screen, and it
       plays offline once saved (manifest.json, sw.js, js/offline.js). -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="images/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arithmetic Odyssey">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/style.css?v=0.7.0">
  <script>
    // Collects errors while the game starts, so the loading check below can
    // show what went wrong (there are no developer tools on an iPad).
    window.aoLoadErrors = [];
    window.addEventListener('error', function (event) {
      var where = event.filename ? ' (' + event.filename.split('/').pop() + ':' + event.lineno + ')' : '';
      window.aoLoadErrors.push((event.message || 'Unknown error') + where);
    });
    window.addEventListener('unhandledrejection', function (event) {
      window.aoLoadErrors.push(String(event.reason && event.reason.message || event.reason));
    });
  </script>
  <!-- The ?v= tags give each version new addresses, so the browser never mixes
       cached files from two versions. Set them with tools/set-version.mjs. -->
  <script type="module" src="js/app.js?v=0.7.0" onerror="window.aoLoadErrors.push('A game file could not be downloaded.')"></script>
</head>
<body>
  <!-- js/app.js replaces this with the game's screens. -->
  <div id="app">
    <main class="screen loading-screen">
      <h1>Arithmetic Odyssey</h1>
      <p id="load-status" class="load-status" role="status">Loading…</p>
    </main>
  </div>

  <noscript><p class="load-error">Arithmetic Odyssey needs JavaScript turned on.</p></noscript>
  <script nomodule>
    document.getElementById('load-status').textContent = 'This browser is too old for Arithmetic Odyssey. Please update the iPad.';
  </script>
  <script>
    // If the game's scripts haven't run after 5 seconds, say so instead of
    // showing "Loading…" forever. js/app.js sets data-ready when it runs.
    // If the game started late, it replaces this message with its screens.
    setTimeout(function () {
      if (document.documentElement.dataset.ready === '1') return;
      var status = document.getElementById('load-status');
      if (!status) return;
      status.textContent = "The game's files didn't load. Check the internet connection and reload.";
      status.className = 'load-status error';
      if (window.aoLoadErrors.length) {
        var details = document.createElement('p');
        details.className = 'load-details';
        details.textContent = 'Details: ' + window.aoLoadErrors.slice(0, 3).join(' | ');
        status.parentNode.appendChild(details);
      }
      var reload = document.createElement('button');
      reload.type = 'button';
      reload.className = 'big-button primary';
      reload.textContent = 'Reload';
      reload.onclick = function () { location.reload(); };
      status.parentNode.appendChild(reload);
    }, 5000);
  </script>
</body>
</html>
