<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <title>Arithmetic Odyssey</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="placeholder">
    <h1>Arithmetic Odyssey</h1>
    <p class="tagline">A math adventure. Coming soon!</p>

    <div class="themes">
      <section class="theme-card dino" aria-label="Dino Tour theme">
        <span class="theme-icon" aria-hidden="true">🦕</span>
        <h2>Dino Tour</h2>
        <p>Travel through the Triassic, Jurassic and Cretaceous.</p>
      </section>
      <section class="theme-card truck" aria-label="Truck Off-Road theme">
        <span class="theme-icon" aria-hidden="true">🛻</span>
        <h2>Truck Off-Road</h2>
        <p>Drive to national parks across the United States.</p>
      </section>
    </div>

    <p id="engine-check" class="engine-check" role="status">Loading…</p>
    <p id="version" class="version"></p>
  </main>

  <noscript><p class="load-error">Arithmetic Odyssey needs JavaScript turned on.</p></noscript>
  <script nomodule>
    document.getElementById('engine-check').textContent = 'This browser is too old for Arithmetic Odyssey. Please update the iPad.';
  </script>
  <script>
    // If the game's scripts haven't run after 5 seconds, say so instead of
    // showing "Loading…" forever. js/app.js sets data-ready when it runs.
    setTimeout(function () {
      if (document.documentElement.dataset.ready !== '1') {
        var check = document.getElementById('engine-check');
        check.textContent = "The game's files didn't load. Check the internet connection and reload.";
        check.className = 'engine-check error';
      }
    }, 5000);
  </script>
</body>
</html>
