# Publishes the repository to GitHub Pages on every push to main.
#
# One-time setup: in the repository's Settings > Pages, set
# "Build and deployment > Source" to "GitHub Actions".
#
# Each action is pinned to an exact commit (its version is in the comment),
# so a changed tag can't change what runs. To update one, find the commit of
# its new release (git ls-remote --tags https://github.com/actions/<name>)
# and replace both.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows running it by hand from the Actions tab

# Nothing by default; each job asks only for what it needs.
permissions: {}

# Only one deployment at a time; a newer push waits for the current one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Runs the repository's own scripts and tests, so it can only read.
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages settings
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing here pushes, so the token isn't kept in the checkout.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*

      # storyline.json is not stored in git; it is built here from each
      # theme's fact files and pictures, so uploaded pictures show up.
      # Fails if a picture folder or file is misnamed.
      - name: Build the game's story files
        run: node arithmetic-odyssey/tools/build-storyline.mjs

      # sw.js (the offline app) is not stored in git either: it lists every
      # file the game needs, with a fingerprint of each, so it is built here
      # after the story files. Fails if a listed file is missing.
      - name: Build the offline app
        run: node arithmetic-odyssey/tools/build-offline.mjs

      - name: Run each tool's tests
        run: |
          found=0
          for tool in */; do
            if [ -d "${tool}tests" ]; then
              found=1
              echo "::group::Tests for ${tool%/}"
              (cd "$tool" && node --test) || exit 1
              echo "::endgroup::"
            fi
          done
          [ "$found" = 1 ] || { echo "No tests found"; exit 1; }

      - name: Build the site folder (copy only, no compiling)
        run: node .github/scripts/assemble-site.mjs _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job can publish; it runs no repository code.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
