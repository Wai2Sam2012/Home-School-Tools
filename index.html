<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <title>Home-School Tools</title>
  <style>
    :root {
      --bg: #fdf8ef;
      --surface: #ffffff;
      --text: #2b2b2b;
      --muted: #6b6457;
      --accent: #1f6f5c;
      --edge: #d9cfbd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1d1f;
        --surface: #26292c;
        --text: #f0ede6;
        --muted: #b4ad9f;
        --accent: #7fd1b9;
        --edge: #3d4246;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 20px;
      line-height: 1.4;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    main { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
    h1 { margin: 0 0 8px; color: var(--accent); font-size: clamp(32px, 6vw, 48px); }
    .intro { margin: 0 0 32px; color: var(--muted); }
    .tools { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
    .tool {
      display: flex;
      align-items: center;
      gap: 20px;
      min-height: 96px;
      padding: 20px 24px;
      border: 3px solid var(--edge);
      border-radius: 20px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
    }
    .tool:hover, .tool:focus-visible { border-color: var(--accent); }
    .tool-icon { font-size: 48px; line-height: 1; }
    .tool h2 { margin: 0 0 4px; font-size: 26px; }
    .tool p { margin: 0; color: var(--muted); font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>Home-School Tools</h1>
    <p class="intro">Learning tools and games. Pick one to start.</p>
    <ul class="tools">
      <li>
        <a class="tool" href="arithmetic-odyssey/">
          <span class="tool-icon" aria-hidden="true">🦕</span>
          <div>
            <h2>Arithmetic Odyssey</h2>
            <p>A math adventure with dinosaurs and national parks.</p>
          </div>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
